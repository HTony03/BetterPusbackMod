name: Build BetterPushback

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      # ------------------------------------------------------------------
      # 1. Check out this repo into a subdirectory so libacfutils can sit
      #    beside it, matching what src/CMakeLists.txt expects:
      #      src/CMakeLists.txt -> file(GLOB LIBACFUTILS "../../libacfutils")
      #    i.e. <workspace>/BetterPusbackMod and <workspace>/libacfutils.
      #    fetch-depth: 0 keeps tags so `git describe --tags` works.
      # ------------------------------------------------------------------
      - name: Checkout BetterPusbackMod
        uses: actions/checkout@v4
        with:
          path: BetterPusbackMod
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. Toolchain. Union of this repo's Dockerfile.win-lin and
      #    libacfutils' install-ubuntu-packages (autoconf/automake/libtool/
      #    unzip are required by the dependency build scripts).
      # ------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config gettext git zip unzip \
            automake autoconf libtool \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxcursor-dev \
            libasound2-dev libpulse-dev portaudio19-dev libsoundio-dev \
            qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools \
            mingw-w64 gcc-mingw-w64 g++-mingw-w64 libz-mingw-w64-dev

      # ------------------------------------------------------------------
      # 3. Resolve the libacfutils revision so the dependency cache below
      #    is reused until that repo actually changes.
      # ------------------------------------------------------------------
      - name: Resolve libacfutils revision
        id: acf
        run: |
          echo "sha=$(git ls-remote https://github.com/olivierbutler/libacfutils.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 4. Cache the fully built libacfutils tree (source + compiled
      #    third-party deps + libacfutils.a for both platforms). Without
      #    this, build_deps+build_redist recompiles ~14 libraries on every
      #    single run. Bump the v1 suffix to force a rebuild.
      # ------------------------------------------------------------------
      - name: Cache built libacfutils
        id: acf-cache
        uses: actions/cache@v4
        with:
          path: libacfutils
          key: libacfutils-v1-${{ runner.os }}-${{ steps.acf.outputs.sha }}

      # ------------------------------------------------------------------
      # 5. Build libacfutils, only on a cache miss.
      #    Two stages, per libacfutils/README-docker.md:
      #      ./build_deps   - compile vendored third-party libraries
      #      ./build_redist - build libacfutils.a (via qmake/build-win-lin)
      #                       for win64 + lin64
      # ------------------------------------------------------------------
      - name: Build libacfutils (deps + library)
        if: steps.acf-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/olivierbutler/libacfutils.git libacfutils
          cd libacfutils

          # libacfutils records its mingw-std-threads submodule at c49f399,
          # which no longer exists upstream (meganz force-pushed it away).
          # Repoint that gitlink at reachable 6c2061b7 - the commit build_deps
          # itself checks out - so the submodule fetch succeeds. The modern
          # comma syntax is tried first, then the legacy space syntax.
          git update-index --cacheinfo \
            "160000,6c2061b7da41d6aa1b2162ff4383ec3ece864bc6,mingw-std-threads" \
            || git update-index --cacheinfo 160000 \
               6c2061b7da41d6aa1b2162ff4383ec3ece864bc6 mingw-std-threads
          git submodule update --init --recursive

          ./build_deps
          ./build_redist

      # ------------------------------------------------------------------
      # 6. Build the plugin and assemble the full install tree.
      #    build_release runs build_xpl.sh (win + lin .xpl) and copies all
      #    data/ assets into ./BetterPushback/. It does NOT zip, so we do.
      # ------------------------------------------------------------------
      - name: Build plugin and assemble install tree
        run: |
          cd BetterPusbackMod
          ./build_release

      - name: Package install tree
        run: |
          cd BetterPusbackMod
          zip -r "BetterPushback_${GITHUB_SHA::8}.zip" BetterPushback/

      # ------------------------------------------------------------------
      # 7. Artifact: only the complete, installable plugin zip. The bare
      #    win_x64/lin_x64 .xpl files are deliberately not uploaded; the
      #    zip already contains both of them plus all data/ assets.
      # ------------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BetterPushback
          path: BetterPusbackMod/*.zip
          if-no-files-found: error
